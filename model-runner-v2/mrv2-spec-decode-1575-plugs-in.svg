<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" role="img" aria-label="Slide 3 of the MRV2 overview, cropped to speculative decoding. SpyreModelRunnerV2 subclasses GPUModelRunner, whose init builds upstream's speculator; the runner replaces it with SpyreDFlashSpeculator, a subclass of DFlashSpeculator. At load, the speculator loads the draft through vLLM's get_model, which resolves the shared Spyre draft classes, then moves it to Spyre. A target that supports EAGLE-3 is wrapped in _SpyreEagle3ModelWrapper, which declares the protocol, so upstream's aux-layer setup accepts it. At KV init, SpyreDFlashSpeculator overrides set_attn: upstream builds the draft's groups, then the override splits them by sliding window; draft KV pages are allocated with the target's. Every step, upstream's sample_tokens calls RejectionSampler, then propose, which writes draft_tokens that the next step verifies.">
<style>
svg { color: #8a93a3; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
.edge { stroke: currentColor; stroke-width: 1.25; fill: none; }
.dash { stroke-dasharray: 4 4; }
.hot { stroke: #2f5fd0; stroke-width: 2; }
.t { fill: #1d2330; font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.s { fill: #5b6475; font-size: 11px; }
.x { fill: #1d2330; font-size: 11.5px; }
.l { fill: #5b6475; font-size: 11px; }
.lh { fill: #2f5fd0; font-size: 11px; font-weight: 600; }
.lane { fill: #f6f7f9; stroke: #dde1e7; }
.lt { fill: #5b6475; font: 600 10.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .08em; }
.vllm { fill: #eef1f6; stroke: #9aa4b5; stroke-width: 1.25; }
.ours { fill: #fff1d6; stroke: #b07a14; stroke-width: 1.5; }
.shared { fill: #e3f4ea; stroke: #1f7a45; stroke-width: 1.5; }
.new { stroke: #2f5fd0; stroke-width: 2.5; }
</style><rect width="880" height="560" fill="#ffffff"/><defs><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5fd0"/></marker></defs>

<!-- runner -->
<rect class="ours" x="20" y="16" width="400" height="62" rx="4"/>
<text class="t" x="32" y="36">SpyreModelRunnerV2 (GPUModelRunner)</text>
<text class="s" x="32" y="53">spyre/model_runner.py</text>
<text class="x" x="32" y="69">__init__: validate_dflash_config, then replace self.speculator</text>
<rect x="20" y="16" width="400" height="62" rx="4" fill="none" class="new"/>

<rect class="vllm" x="460" y="16" width="400" height="62" rx="4"/>
<text class="t" x="472" y="36">GPUModelRunner</text>
<text class="s" x="472" y="53">gpu/model_runner.py · upstream</text>
<text class="x" x="472" y="69">builds, loads, attaches and calls self.speculator</text>
<path class="edge" d="M420,47 L458,47" marker-end="url(#aa)"/>
<text class="l" x="425" y="41">extends</text>

<!-- three lanes -->
<rect class="lane" x="20" y="100" width="840" height="140" rx="8"/>
<text class="lt" x="32" y="118">LOAD · load_model</text>
<rect class="lane" x="20" y="252" width="840" height="122" rx="8"/>
<text class="lt" x="32" y="270">KV INIT · initialize_kv_cache</text>
<rect class="lane" x="20" y="386" width="840" height="160" rx="8"/>
<text class="lt" x="32" y="404">EVERY STEP · upstream sample_tokens, unchanged</text>

<!-- load lane -->
<rect class="ours" x="36" y="128" width="250" height="98" rx="4"/>
<text class="t" x="48" y="147">SpyreDFlashSpeculator</text>
<text class="s" x="48" y="162">(DFlashSpeculator) · spec_decode.py</text>
<text class="x" x="48" y="182">load_draft_model: upstream loader,</text>
<text class="x" x="48" y="197">then move_model_to_spyre +</text>
<text class="x" x="48" y="212">prepare_for_spyre</text>
<rect x="36" y="128" width="250" height="98" rx="4" fill="none" class="new"/>

<rect class="shared" x="330" y="128" width="250" height="98" rx="4"/>
<text class="t" x="342" y="147">SpyreQwen3XPressForCausalLM</text>
<text class="s" x="342" y="162">qwen3_dflash.py · V1 uses it too</text>
<text class="x" x="342" y="182">resolved by vLLM get_model from</text>
<text class="x" x="342" y="197">the registry; shares the target's</text>
<text class="x" x="342" y="212">embed and lm_head</text>
<path class="edge" d="M286,177 L328,177" marker-end="url(#aa)"/>
<text class="l" x="292" y="170">loads</text>

<rect class="ours" x="624" y="128" width="222" height="98" rx="4"/>
<text class="t" x="636" y="147">_SpyreEagle3ModelWrapper</text>
<text class="s" x="636" y="162">(_SpyreModelWrapper) · load.py</text>
<rect class="vllm" x="636" y="170" width="198" height="26" rx="3"/>
<text class="t" x="646" y="188">SupportsEagle3 target</text>
<text class="x" x="636" y="212">only for a model that has it</text>
<rect x="624" y="128" width="222" height="98" rx="4" fill="none" class="new"/>

<!-- kv lane -->
<rect class="vllm" x="36" y="280" width="250" height="80" rx="4"/>
<text class="t" x="48" y="299">DraftModelSpeculator.set_attn</text>
<text class="s" x="48" y="314">spec_decode/speculator.py · upstream</text>
<text class="x" x="48" y="334">builds the draft's attention</text>
<text class="x" x="48" y="349">groups and metadata builders</text>

<rect class="ours" x="330" y="280" width="250" height="80" rx="4"/>
<text class="t" x="342" y="299">SpyreDFlashSpeculator.set_attn</text>
<text class="s" x="342" y="314">override · spec_decode.py</text>
<text class="x" x="342" y="334">super(), then split_by_window,</text>
<text class="x" x="342" y="349">as the target's groups are split</text>
<rect x="330" y="280" width="250" height="80" rx="4" fill="none" class="new"/>
<path class="edge hot" d="M328,320 L288,320" marker-end="url(#ah)"/>
<text class="lh" x="294" y="313">super()</text>

<rect class="shared" x="624" y="280" width="222" height="80" rx="4"/>
<text class="t" x="636" y="299">SpyrePagedKVCache</text>
<text class="s" x="636" y="314">spyre_attn.py</text>
<text class="x" x="636" y="334">draft layers get pages beside</text>
<text class="x" x="636" y="349">the target's (no change)</text>
<path class="edge" d="M580,320 L622,320" marker-end="url(#aa)"/>
<text class="l" x="586" y="313">allocates</text>

<!-- step lane -->
<rect class="vllm" x="36" y="414" width="190" height="82" rx="4"/>
<text class="t" x="48" y="433">target forward</text>
<text class="s" x="48" y="448">K+1 verify rows / request</text>
<text class="x" x="48" y="468">hidden + aux hidden states</text>
<text class="x" x="48" y="483">(aux kept on Spyre)</text>

<rect class="vllm" x="262" y="414" width="190" height="82" rx="4"/>
<text class="t" x="274" y="433">RejectionSampler</text>
<text class="s" x="274" y="448">triton-cpu on x86 · #1238</text>
<text class="x" x="274" y="468">greedy drafts → one-hot path</text>
<text class="x" x="274" y="483">num_sampled, num_rejected</text>

<rect class="vllm" x="488" y="414" width="190" height="82" rx="4"/>
<text class="t" x="500" y="433">propose()</text>
<text class="s" x="500" y="448">upstream · Triton input prep</text>
<rect class="ours" x="496" y="456" width="174" height="34" rx="3"/>
<rect x="496" y="456" width="174" height="34" rx="3" fill="none" class="new"/>
<text class="x" x="504" y="470">hooks: pad, store, run,</text>
<text class="x" x="504" y="484">propose_block on Spyre</text>

<rect class="vllm" x="714" y="414" width="132" height="82" rx="4"/>
<text class="t" x="726" y="433">req_states</text>
<text class="s" x="726" y="448">.draft_tokens</text>
<text class="x" x="726" y="468">spliced into the</text>
<text class="x" x="726" y="483">next step's input</text>

<path class="edge" d="M226,455 L260,455" marker-end="url(#aa)"/>
<path class="edge" d="M452,455 L486,455" marker-end="url(#aa)"/>
<path class="edge" d="M678,455 L712,455" marker-end="url(#aa)"/>
<path class="edge dash" d="M780,496 L780,526 L131,526 L131,498" marker-end="url(#aa)"/>
<text class="l" x="380" y="520">next step verifies them</text>


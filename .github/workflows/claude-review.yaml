name: Claude PR Review (on-hardware)
run-name: Claude review of PR #${{ github.event.issue.number || github.event.pull_request.number }}

# ---------------------------------------------------------------------------
# On-demand Claude Code review that runs on the Spyre self-hosted runner so
# the agent can exercise the accelerator
# ---------------------------------------------------------------------------
on:
  issue_comment:
    types: [created]
  # >>> TEMPORARY (remove before merge): lets this be tested from a same-repo
  # branch PR, which -- unlike issue_comment -- runs the PR-branch version of
  # this file with secrets. Every push re-runs it. Only fires for same-repo
  # branches (fork PRs still get no secrets on pull_request).
  pull_request:
    types: [opened, synchronize, reopened]
  # <<< END TEMPORARY

concurrency:
  # Spyre is single-accelerator: never let a PR's review race itself.
  group: claude-review-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # post the review back to the PR
  issues: write          # PR-level (issue) comments
  id-token: write        # required by claude-code-action's auth path
  actions: read

jobs:
  review:
    # issue_comment path: a comment on a PR (not a plain issue), the trigger
    # command, and a commenter with write access (author_association is the
    # proxy -- OWNER/MEMBER for org maintainers, COLLABORATOR for outside
    # collaborators with write; a fork author is CONTRIBUTOR/NONE, rejected).
    #
    # >>> TEMPORARY: the first clause shortcuts the guard for a same-repo branch
    # PR so you can iterate. Remove it (and the pull_request trigger) before merge.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/claude-review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    # <<< END TEMPORARY (restore the plain issue_comment guard)
    runs-on:
      - x86_64
      - spyre_pf_x2
      - linux
      - image_torch_spyre
    timeout-minutes: 60
    env:
      # Mirror the test runners
      CI: ''
      STORAGE_1_DIR: /storage-1/spyre-inference
      HF_HOME: /storage-1/spyre-inference/.cache/huggingface
      HF_HUB_OFFLINE: '1'

    steps:
      # Default ref = trusted default branch. We intentionally do NOT check out
      # the PR head -- the diff is fetched as text by the review skill.
      - name: Checkout (default branch, trusted)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Spyre RPMs
        uses: ./.github/actions/spyre-rpm-install

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            spyre-rpms.lock

      - name: Install spyre-inference
        run: |
          source "$HOME/.bashrc"
          source /etc/profile.d/ibm-aiu-setup.sh
          uv sync --frozen --group dev

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          # CANNED prompt -- not taken from the comment. Extra text a maintainer
          # types after /claude-review is ignored; only this runs.
          prompt: |
            /code-review ${{ github.event.issue.number || github.event.pull_request.number }}

            Use the spyre-knowledgebase to search for relevant context.
            Verify the correctness of all modified behavior, using the provided spyre hardware.

            Be sure to validate that all new behavior is covered by tests. Additionally, ensure that
            any added tests are actually run through CI. This includes making sure that tests are
            scheduled on jobs that have the correct number of spyre cards to execute them.

            If this PR already has open comments, validate that the appropriate changes have been
            made to address them. Reply to these comments either asking for more changes or
            confirming that the comment can be resolved.

            Write all prose replies in **ASD-STE100 Simplified Technical English**: active voice,
            short sentences, one instruction per sentence, approved words only, no synonyms, no
            slang or idioms.

          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          claude_args: >-
            --model claude-opus-4-8
            --max-turns 40
            --mcp-config '{"mcpServers":{"spyre-knowledgebase":{"type":"http","url":"${{ secrets.SPYRE_KB_MCP_URL }}"}}}'
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*),Bash(uv run:*),Bash(git diff:*),Bash(git log:*),mcp__spyre-knowledgebase,mcp__github_inline_comment__create_inline_comment"
        env:
          GH_TOKEN: ${{ github.token }}          # so the review skill can fetch the diff
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          API_TIMEOUT_MS: "1200000"

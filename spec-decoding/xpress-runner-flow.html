<h1>One speculative step through the Spyre V1 runner</h1>
<p class="meta">XPress speculative decoding on Spyre: the five-stage stack starting at <a href="https://github.com/torch-spyre/spyre-inference/pull/1394">#1394</a> (merged), stages 2–5 drawn from <a href="https://github.com/ani300/spyre-inference/pull/4">ani300/spyre-inference#4</a> (<code>5234eea</code>) on vLLM 0.32.0.</p>

 UI, sans-serif" paint-order="stroke" stroke="var(--bg)" stroke-width="4" style="fill: currentColor">drafts for the next step</text><text x="150" y="590" font-size="11.5" dominant-baseline="central" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif" style="fill: currentColor; opacity: 0.68">Host steps 3 and 4 sit between the target and draft phases on every step: hidden states and logits make round trips through the host, and the rejection loop runs there.</text><text x="150" y="608" font-size="11.5" dominant-baseline="central" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif" style="fill: currentColor; opacity: 0.68">Steps 5–7 are the drafter; the target model sees nothing XPress-specific.</text></svg>
<figcaption>Shown for greedy serving, which is the only mode the stack accepts. Numbers follow one step: verification of the previous step's drafts (1–3) and drafting of the next step's (4–8) share a single target forward. Accepted rows of the target's context become draft KV; rejected rows and batch padding write only the reserved null page, so a request's later suffix is never overwritten. Up to four requests draft together; three pad to four.</figcaption>

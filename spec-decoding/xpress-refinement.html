<h1>How the XPress refiner proposes a block</h1>
<p class="meta">XPress speculative decoding on Spyre: the five-stage stack starting at <a href="https://github.com/torch-spyre/spyre-inference/pull/1394">#1394</a> (merged), stages 2–5 drawn from <a href="https://github.com/ani300/spyre-inference/pull/4">ani300/spyre-inference#4</a> (<code>5234eea</code>) on vLLM 0.32.0.</p>
<figure>

"system-ui, -apple-system, Segoe UI, sans-serif" style="fill: currentColor; opacity: 0.68">slot k</text><text x="232" y="544" font-size="12" dominant-baseline="central" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif" style="fill: currentColor">Folded at load: mix_L = L·tril + I, so one pass is one mix with no mask and no residual add.</text><text x="232" y="564" font-size="12" dominant-baseline="central" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif" style="fill: currentColor">Slot k mixes only slots j at or before k. A settled prefix cannot be disturbed by later slots, so</text><text x="232" y="584" font-size="12" dominant-baseline="central" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif" style="fill: currentColor">repeated greedy passes converge monotonically from the anchor outward (Jacobi decoding).</text><text x="232" y="604" font-size="12" dominant-baseline="central" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif" style="fill: currentColor">Candidates are fixed after the initial top-128: the refiner can only reorder them, never</text><text x="232" y="624" font-size="12" dominant-baseline="central" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif" style="fill: currentColor">reach a token outside the shortlist. topc=0 restores exact full-vocabulary scoring.</text></svg>
<figcaption><code>propose_block</code> with the default <code>xpress_topc=128</code>. Only token ids and candidate scores cross the host boundary inside the loop, never the full-vocabulary logits after the first selection. Ids are built and selected on the host because Spyre has no int64, its <code>topk</code> returns fp16 indices, and its embedding gather needs flat host-built indices. Stage 5's opt-in paths remove those round trips: <code>SPYRE_XPRESS_DEVICE_FEEDBACK=1</code> encodes ids as two base-512 fp16 digits on Spyre, and <code>SPYRE_XPRESS_DEVICE_SELECTION=1</code> also takes the initial shortlist there. Both need a patched torch-spyre and Deeptools.</figcaption>

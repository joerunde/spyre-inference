# Serve benchmarks for Spyre devices
- test_name: serve_granite8B_tp1_in64_out64
  environment_variables:
    VLLM_CPU_KVCACHE_SPACE: 64
    DTLOG_LEVEL: error
    SPYRE_DEVICES: '0'
  server_parameters:
    model: ibm-ai-platform/micro-g3.3-8b-instruct-1b
    dtype: float16
    load-format: auto
    max-num-seqs: 4
    port: 8000
    host: 127.0.0.1
  parameters:
    model: ibm-ai-platform/micro-g3.3-8b-instruct-1b
    input-len: 64
    output-len: 64
    num-prompts: 16
    # Unmeasured warmup requests so the reported metrics exclude the one-time
    # per-shape torch.compile cost paid by the first requests.
    num-warmups: 8
    # Cap concurrency at the server's max-num-seqs and let requests burst
    # (request-rate: inf), so the batch fills without queueing and TTFT
    # reflects a server loaded to its batch capacity rather than an idle one.
    max-concurrency: 4
    request-rate: inf
- test_name: serve_granite33-8b_tp1_in64_out64
  # The server only reports healthy once the 8B finishes its warmup compile,
  # which is well past the 180s default health wait.
  server_health_timeout: 1800
  environment_variables:
    VLLM_CPU_KVCACHE_SPACE: 64
    DTLOG_LEVEL: error
    SPYRE_DEVICES: '0'
    # Force attention through the compiled path (otherwise mode!=NONE still
    # leaves _maybe_compile a no-op for the attention op on Spyre).
    SPYRE_FORCE_COMPILE_ATTN: '1'
    # The 8B's one-time warmup compile exceeds vLLM's 300s default
    # execute_model RPC timeout, which kills the worker mid-compile.
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '1800'
  server_parameters:
    model: ibm-granite/granite-3.3-8b-instruct
    dtype: float16
    load-format: auto
    # mode 1 == STOCK_TORCH_COMPILE; the platform maps any non-NONE mode to it.
    compilation-config: '{"mode": 1}'
    max-num-seqs: 4
    port: 8000
    host: 127.0.0.1
  parameters:
    model: ibm-granite/granite-3.3-8b-instruct
    input-len: 64
    output-len: 64
    num-prompts: 16
    # Unmeasured warmup requests so the reported metrics exclude the one-time
    # per-shape torch.compile cost paid by the first requests.
    num-warmups: 8
    # Cap concurrency at the server's max-num-seqs and let requests burst
    # (request-rate: inf), so the batch fills without queueing and TTFT
    # reflects a server loaded to its batch capacity rather than an idle one.
    max-concurrency: 4
    request-rate: inf

<title>Perf Entrypoint Cleanup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one reading column; each figure is a wide, self-scrolling plate with a caption below. */
:root {
  --bg: #f6f7f9;
  --plate: #ffffff;
  --fg: #1b2230;
  --muted: #5d6677;
  --rule: #d5dae3;
  --gone: #b4442f;
  --new: #1f7a5a;
  --flow: #2f5fb3;
  --gone-soft: #f6e3de;
  --new-soft: #dcefe6;
  --flow-soft: #e1e9f7;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151c; --plate: #181d26; --fg: #e3e7ee; --muted: #9aa3b3; --rule: #2c3442;
    --gone: #e7836d; --new: #5fc79f; --flow: #82a7ec;
    --gone-soft: #3a221d; --new-soft: #17332a; --flow-soft: #1c2a42;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151c; --plate: #181d26; --fg: #e3e7ee; --muted: #9aa3b3; --rule: #2c3442;
  --gone: #e7836d; --new: #5fc79f; --flow: #82a7ec;
  --gone-soft: #3a221d; --new-soft: #17332a; --flow-soft: #1c2a42;
  color-scheme: dark;
}
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
}
main {
  max-width: 1120px;
  margin: 0 auto;
  padding-block: 40px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  gap: 40px;
}
header { display: grid; gap: 8px; max-width: 68ch; }
.eyebrow {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}
h1 { margin: 0; font-size: 30px; font-weight: 600; line-height: 1.2; text-wrap: balance; }
h2 { margin: 0; font-size: 20px; font-weight: 600; text-wrap: balance; }
p { margin: 0; }
code { font-family: var(--font-mono); font-size: 0.92em; }
section { display: grid; gap: 14px; }
section > p { max-width: 70ch; color: var(--muted); }
figure { margin: 0; display: grid; gap: 12px; }
.plate {
  background: var(--plate);
  border: 1px solid var(--rule);
  border-radius: 6px;
  overflow-x: auto;
  padding: 16px;
}
.plate svg { display: block; width: 100%; min-width: 900px; height: auto; color: var(--fg); }
figcaption { font-size: 13px; color: var(--muted); max-width: 80ch; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.sw { width: 14px; height: 14px; border-radius: 3px; border: 1.5px solid; }
.sw.gone { border-color: var(--gone); background: var(--gone-soft); }
.sw.new { border-color: var(--new); background: var(--new-soft); }
.sw.kept { border-color: var(--muted); background: var(--plate); }
.sw.flow { border-color: var(--flow); background: var(--flow-soft); }

/* SVG roles, drawn from the page tokens so both themes read. */
.t { font-family: var(--font-body); font-size: 13px; fill: var(--fg); }
.tb { font-family: var(--font-body); font-size: 14px; font-weight: 600; fill: var(--fg); }
.tm { font-family: var(--font-mono); font-size: 12px; fill: var(--fg); }
.tmb { font-family: var(--font-mono); font-size: 13px; font-weight: 500; fill: var(--fg); }
.ts { font-family: var(--font-body); font-size: 12px; fill: var(--muted); }
.tcol { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.06em; fill: var(--muted); }
.tgone { fill: var(--gone); }
.tnew { fill: var(--new); }
.tflow { fill: var(--flow); }
.box { fill: var(--plate); stroke: var(--muted); stroke-width: 1.2; }
.box-gone { fill: var(--gone-soft); stroke: var(--gone); stroke-width: 1.5; stroke-dasharray: 5 4; }
.box-new { fill: var(--new-soft); stroke: var(--new); stroke-width: 1.5; }
.box-flow { fill: var(--flow-soft); stroke: var(--flow); stroke-width: 1.5; }
.chip-gone { fill: var(--gone-soft); stroke: var(--gone); stroke-width: 1; }
.chip-new { fill: var(--new-soft); stroke: var(--new); stroke-width: 1; }
.chip { fill: var(--bg); stroke: var(--rule); stroke-width: 1; }
.rule { stroke: var(--rule); stroke-width: 1; }
.strike { stroke: var(--gone); stroke-width: 1.4; }
.mv { fill: none; stroke: var(--new); stroke-width: 1.6; }
.mv-gone { fill: none; stroke: var(--gone); stroke-width: 1.6; stroke-dasharray: 5 4; }
.call { fill: none; stroke: var(--flow); stroke-width: 1.5; }
.call-muted { fill: none; stroke: var(--muted); stroke-width: 1.3; }
.ah-new { fill: var(--new); }
.ah-gone { fill: var(--gone); }
.ah-flow { fill: var(--flow); }
.ah-muted { fill: var(--muted); }
</style>

<main>
  <header>
    <div class="eyebrow">spyre-inference · PR 1 of 3</div>
    <h1>One way to run perf benchmarks</h1>
    <p>Perf benchmarks had two triggers that each carried their own copy of the job. This removes <code>vllm-benchmark.yml</code> and keeps the one the upstream repos and Jenkins already dispatch.</p>
  </header>

  <section aria-labelledby="h-a">
    <h2 id="h-a">Two routes to the same benchmarks, before and after</h2>
    <figure>
      <div class="plate">
        <svg viewBox="0 0 1080 430" role="img" aria-label="Before: a PR labelled vllm-bench or a manual dispatch ran vllm-benchmark.yml, which had its own matrix generator and environment setup; separately, integration-tests.yaml with test_type=perf ran the perf job in _test_matrix.yaml. Both ended at make perf-tests and the ClickHouse ingest. After: only the integration-tests.yaml route remains.">
          <defs>
            <marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah-flow"/></marker>
            <marker id="a-gone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah-gone"/></marker>
          </defs>

          <text x="20" y="26" class="tcol">TRIGGER</text>
          <text x="330" y="26" class="tcol">WORKFLOW</text>
          <text x="800" y="26" class="tcol">RUNS</text>

          <!-- removed route -->
          <rect x="20" y="48" width="250" height="78" rx="6" class="box-gone"/>
          <text x="36" y="72" class="tb tgone">vllm-bench PR label</text>
          <text x="36" y="94" class="ts">or a manual dispatch</text>
          <text x="36" y="112" class="ts">no passing run since #1272</text>

          <rect x="320" y="40" width="420" height="160" rx="6" class="box-gone"/>
          <text x="336" y="64" class="tmb tgone">workflows/vllm-benchmark.yml</text>
          <text x="724" y="64" class="ts" text-anchor="end">deleted · 286 lines</text>
          <rect x="336" y="78" width="388" height="34" rx="4" class="chip-gone"/>
          <text x="348" y="99" class="tm tgone">generate_vllm_benchmark_matrix.py</text>
          <rect x="336" y="120" width="388" height="34" rx="4" class="chip-gone"/>
          <text x="348" y="141" class="tm tgone">RPMs · uv cache · uv sync · ingest venv</text>
          <text x="336" y="180" class="ts">its own copy of the perf setup, plus requirements-benchmark.txt</text>

          <path d="M270 87 L 316 87" class="mv-gone" marker-end="url(#a-gone)"/>
          <path d="M740 120 C 770 120, 770 240, 796 244" class="mv-gone" marker-end="url(#a-gone)"/>

          <!-- kept route -->
          <rect x="20" y="236" width="250" height="96" rx="6" class="box"/>
          <text x="36" y="260" class="tb">Upstream repos, Jenkins</text>
          <text x="36" y="282" class="tm">integration-tests.yaml</text>
          <text x="36" y="302" class="ts">test_type = perf</text>
          <text x="36" y="320" class="ts">+ skip_uv_for_benchmarking (new)</text>

          <rect x="320" y="236" width="420" height="96" rx="6" class="box"/>
          <text x="336" y="260" class="tmb">workflows/_test_matrix.yaml</text>
          <text x="724" y="260" class="ts" text-anchor="end">perf job, unchanged</text>
          <text x="336" y="284" class="t">the route every upstream perf run already takes</text>
          <text x="336" y="306" class="ts">already took skip_uv_for_benchmarking; the</text>
          <text x="336" y="322" class="ts">dispatch entrypoint now forwards it (for s390x)</text>

          <path d="M270 284 L 316 284" class="call" marker-end="url(#a-flow)"/>
          <path d="M740 284 C 770 284, 770 266, 796 264" class="call" marker-end="url(#a-flow)"/>

          <rect x="800" y="220" width="260" height="96" rx="6" class="box-flow"/>
          <text x="816" y="244" class="tb tflow">make perf-tests</text>
          <text x="816" y="268" class="t">vLLM latency, throughput,</text>
          <text x="816" y="288" class="t">serve benchmarks</text>
          <text x="816" y="306" class="ts">→ ClickHouse ingest</text>

          <line x1="20" y1="370" x2="1060" y2="370" class="rule"/>
          <text x="20" y="398" class="t">Net change: 3 files deleted, 1 obsolete test removed, 1 input forwarded.</text>
          <text x="20" y="418" class="ts">The perf job itself is untouched here; PRs 2 and 3 reshape it.</text>
        </svg>
      </div>
      <figcaption>Dashed red is what this PR deletes. Both routes ended at the same <code>make perf-tests</code>, so keeping only the dispatch route loses no benchmark. The <code>vllm-bench</code> label stops triggering anything.</figcaption>
    </figure>
  </section>
</main>
